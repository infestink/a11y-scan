[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a11y-scan"
version = "0.1.0"
description = "Automated accessibility scanning with axe-core and Playwright"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "coverage>=7.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no network",
    "integration: local fixture pages",
    "api: FastAPI TestClient",
    "e2e: live network required",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
