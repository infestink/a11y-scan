name: Nightly Scan

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:        # allow manual triggers

jobs:
  scan:
    name: Scan target sites
    runs-on: ubuntu-latest
    env:
      DB_PATH: ./data/scans.db
      REPORTS_DIR: ./reports
      TARGETS_FILE: ./targets.yaml
      REGRESSION_THRESHOLD: ${{ vars.REGRESSION_THRESHOLD || '5' }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # Restore the SQLite history so we can diff against yesterday's run.
      - name: Restore scan history
        uses: actions/cache@v4
        with:
          path: data/
          key: scan-history-${{ github.run_id }}
          restore-keys: scan-history-

      - name: Run nightly scan
        run: |
          mkdir -p data reports
          python -m src.scanner.nightly_runner \
            --targets targets.yaml \
            --db "$DB_PATH" \
            --reports-dir "$REPORTS_DIR" \
            --threshold "$REGRESSION_THRESHOLD"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      # Persist updated history for tomorrow's run.
      - name: Save scan history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: scan-history-${{ github.run_id }}
